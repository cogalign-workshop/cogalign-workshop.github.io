- question: Is the workshop archival?
  answer: The workshop is planned as non-archival. Authors retain the right to submit extended versions to archival venues.
- question: What types of submissions are welcome?
  answer: Research papers, position papers, benchmark papers, dataset papers, systems papers, and interdisciplinary studies are welcome.
- question: Are invited speakers confirmed?
  answer: No. Speaker names on this site are listed as Potential / TBC until confirmations are finalized.
- question: When will the submission site open?
  answer: The submission site is TBC. The tentative submission opening date is July 15, 2026.
- question: Can authors submit extended versions elsewhere?
  answer: Yes. The planned proceedings are non-archival, so authors retain the right to submit extended versions to archival venues.
- question: Will the workshop support remote participation?
  answer: Remote participation or recording support is TBC and depends on conference-provided infrastructure.
- question: Where will accepted papers be posted?
  answer: Accepted papers, slides, posters, and post-workshop resources are expected to be hosted on this website after the workshop, subject to author permission and conference policy.
- question: How should conflicts of interest be handled?
  answer: Conflicted organizers will not participate in reviewing or decisions for conflicted submissions. Additional conflict details will be disclosed when confirmed.
