diversity:
  gender_balance: Current invited speaker and panelist roster includes approximately five female and two male speakers.
  seniority_diversity: Organizers include Ph.D. students, a research engineer, an industry researcher, an assistant professor, and a senior academic leader.
  geographic_diversity: Organizers and speakers represent North America, Europe, Asia, the Middle East, and Australia through affiliations and professional backgrounds.
  institutional_diversity: Organizers are affiliated with MBZUAI, University of Maryland, University of Washington, Carnegie Mellon University, Abaka AI, and 2077AI Foundation.
  sector_diversity: The workshop includes academia, industrial research, and industry-facing organizations.
