diversity:
  gender_balance: The organizing team includes two female and five male organizers; the invited roster includes approximately five female and two male speakers.
  seniority_diversity: Organizers include Ph.D. students, a research engineer, an industry researcher, assistant and associate professors, and a senior academic leader.
  geographic_diversity: Organizers and speakers represent North America, Europe, Asia, the Middle East, and Australia.
  institutional_diversity: Organizers are affiliated with MBZUAI, University of Maryland, University of Washington, Carnegie Mellon University, Meta AI Research, Abaka AI, and 2077AI Foundation.
  sector_diversity: The workshop includes academia, industrial research, and industry-facing organizations.
